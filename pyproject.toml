[project]
name = "dl-ca2"
version = "0.1.0"
description = "Project for DL CA2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ast-comments>=1.3.0",
    "ipykernel>=7.3.0",
    "ipython~=8.39.0",
    "jupytext>=1.19.0",
    "matplotlib~=3.10.9",
    "nbformat>=5.10.4",
    "pandas>=2.3.3",
    "scikit-image>=0.25.2",
    "scipy>=1.15.3",
    "torch==2.9.0",
    "torchvision==0.2.0",
]

[project.scripts]
sync-notebooks = "scripts.sync:sync"
build = "scripts.build:build_default"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
