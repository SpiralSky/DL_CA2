[project]
name = "dl-ca2"
version = "0.1.0"
description = "Project for DL CA2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.3.0",
    "ipython~=8.39.0",
    "jupytext>=1.19.0",
    "matplotlib~=3.10.9",
    "nbformat>=5.10.4",
]

[project.scripts]
sync-notebooks = "scripts.sync:sync"
build = "scripts.build:build_default"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
